<h2>다크 / 라이트 모드</h2>
<p class="subtitle">테마 전환 방식을 골라주세요.</p>

<div class="cards">
  <div class="card" data-choice="light-only" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#faf7f2;padding:20px;border-radius:8px;text-align:center;">
        <div style="background:#fffbf5;border-left:4px solid #c2410c;padding:20px;max-width:220px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;">
          <div style="width:60px;height:30px;background:#f5efe6;border-radius:6px;display:flex;align-items:center;justify-content:center;">
            <div style="width:20px;height:20px;background:#f59e0b;border-radius:50%;box-shadow:0 0 8px #f59e0b;"></div>
          </div>
          <div style="font-size:13px;font-weight:600;color:#1c1917;">Light Only</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 라이트 전용</h3>
      <p>워머 에디토리얼 톤만. 심플, 일관된 경험.</p>
    </div>
  </div>

  <div class="card" data-choice="dark-only" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1c1917;padding:20px;border-radius:8px;text-align:center;">
        <div style="background:#292524;border-left:4px solid #c2410c;padding:20px;max-width:220px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;">
          <div style="width:60px;height:30px;background:#1c1917;border-radius:6px;display:flex;align-items:center;justify-content:center;">
            <div style="width:20px;height:20px;background:#57534e;border-radius:50%;box-shadow:inset 0 0 4px rgba(0,0,0,0.5);"></div>
          </div>
          <div style="font-size:13px;font-weight:600;color:#faf7f2;">Dark Only</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 다크 전용</h3>
      <p>다크 에디토리얼 톤. 미려한 야간 환경.</p>
    </div>
  </div>

  <div class="card" data-choice="toggle-both" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:linear-gradient(135deg,#faf7f2 50%,#1c1917 50%);padding:20px;border-radius:8px;text-align:center;">
        <div style="background:#fffbf5;border-left:4px solid #c2410c;padding:16px;max-width:220px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;">
          <div style="width:60px;height:30px;background:#f5efe6;border-radius:6px;display:flex;align-items:center;justify-content:center;">
            <div style="width:20px;height:20px;background:#f59e0b;border-radius:50%;box-shadow:0 0 8px #f59e0b;"></div>
          </div>
          <div style="font-size:13px;font-weight:600;color:#1c1917;">☀ / ☽</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 토글 전환 (둘 다)</h3>
      <p>사용자가 선택. 동일 카드로 라이트/다크 각각 다른 무드.</p>
    </div>
  </div>
</div>
