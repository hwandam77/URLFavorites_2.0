<h2>카드 & 컴포넌트 디자인</h2>
<p class="subtitle">선택한 스타일에 맞춰 카드设计方案을 보여줍니다.</p>

<div class="cards">
  <div class="card" data-choice="surface-card" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#faf7f2;padding:20px;border-radius:8px;text-align:center;">
        <div style="background:#fffbf5;border:1px solid #e8ddd0;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(139,90,43,0.08);max-width:260px;margin:0 auto;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
            <div style="width:40px;height:40px;background:#c2410c;border-radius:8px;opacity:0.8;"></div>
            <div style="flex:1;">
              <div style="height:10px;width:70%;background:#f5efe6;border-radius:4px;margin-bottom:6px;"></div>
              <div style="height:8px;width:90%;background:#f5efe6;border-radius:4px;"></div>
            </div>
          </div>
          <div style="height:8px;width:60%;background:#f5efe6;border-radius:4px;margin-bottom:12px;"></div>
          <div style="display:flex;gap:6px;">
            <div style="background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;">태그1</div>
            <div style="background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;">태그2</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 서피스 카드</h3>
      <p>깊은 그림자, 라운드 코너, 표면 레이어링. 부유하는 느낌.</p>
    </div>
  </div>

  <div class="card" data-choice="outline-card" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#faf7f2;padding:20px;border-radius:8px;text-align:center;">
        <div style="background:#fffbf5;border:2px solid #d4c4b0;border-radius:12px;padding:20px;max-width:260px;margin:0 auto;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
            <div style="width:40px;height:40px;background:#c2410c;border-radius:8px;opacity:0.8;"></div>
            <div style="flex:1;">
              <div style="height:10px;width:70%;background:#f5efe6;border-radius:4px;margin-bottom:6px;"></div>
              <div style="height:8px;width:90%;background:#f5efe6;border-radius:4px;"></div>
            </div>
          </div>
          <div style="height:8px;width:60%;background:#f5efe6;border-radius:4px;margin-bottom:12px;"></div>
          <div style="display:flex;gap:6px;">
            <div style="background:transparent;border:1.5px solid #d4c4b0;color:#92400e;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;">태그1</div>
            <div style="background:transparent;border:1.5px solid #d4c4b0;color:#92400e;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;">태그2</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 아웃라인 카드</h3>
      <p>테두리만, 그림자 없음. 플랫, 세련된.</p>
    </div>
  </div>

  <div class="card" data-choice="editorial-card" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#faf7f2;padding:20px;border-radius:8px;text-align:center;">
        <div style="background:#fffbf5;border-left:4px solid #c2410c;padding:20px;max-width:260px;margin:0 auto;">
          <div style="font-size:22px;font-weight:700;color:#1c1917;margin-bottom:8px;letter-spacing:-0.5px;">타이틀</div>
          <div style="font-size:13px;color:#78716c;margin-bottom:12px;line-height:1.5;">URL 설명이 여기 들어갑니다. 두 줄까지 표시됩니다.</div>
          <div style="display:flex;gap:6px;">
            <div style="background:#c2410c;color:#fff;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;">태그1</div>
            <div style="background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;">태그2</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 에디토리얼 카드</h3>
      <p>좌측 액센트 보더, 대형 타이틀. 잡지 레이아웃.</p>

  </div>
</div>
